name: Shell 与系统兼容性检查

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  system_matrix:
    name: ${{ matrix.container }} / Bash 兼容性测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:11
          - debian:12
          - ubuntu:20.04
          - ubuntu:22.04
    container:
      image: ${{ matrix.container }}
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 执行 Shell 与系统识别测试
        run: bash ci/validate.sh

  shellcheck:
    name: ShellCheck 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 安装 ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: 检查全部 Shell 脚本
        run: |
          find . -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            shellcheck "$file"
          done

  secret_history_scan:
    name: Gitleaks 工作区与完整 Git 历史扫描
    runs-on: ubuntu-latest
    steps:
      - name: 拉取全部分支与标签历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 使用固定版本 Gitleaks 扫描工作区和全部历史
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -Eeuo pipefail
          docker pull "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}"
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            dir --redact --exit-code=2 /repo
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git --redact --exit-code=2 --log-opts="--all" /repo
          bash ci/scan-source-archives.sh
