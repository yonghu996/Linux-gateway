name: Shell 与系统兼容性检查

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  system_matrix:
    name: ${{ matrix.container }} / Bash 兼容性测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        container:
          - debian:11
          - debian:12
          - ubuntu:20.04
          - ubuntu:22.04
    container:
      image: ${{ matrix.container }}
    steps:
      - name: 拉取源码
        uses: actions/checkout@v6
      - name: 执行 Shell 与系统识别测试
        run: bash ci/validate.sh

  shellcheck:
    name: ShellCheck 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v6
      - name: 安装 ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: 检查全部 Shell 脚本
        run: |
          find . -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            shellcheck "$file"
          done

  secret_history_scan:
    name: Gitleaks 工作区与完整 Git 历史扫描
    runs-on: ubuntu-latest
    steps:
      - name: 拉取全部分支与标签历史
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 安装并校验 Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION='8.30.1'
          FILE="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error "$BASE/$FILE" -o "$RUNNER_TEMP/$FILE"
          curl --fail --location --silent --show-error "$BASE/gitleaks_${VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          grep -F "  $FILE" "$RUNNER_TEMP/checksums.txt" | (cd "$RUNNER_TEMP" && sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/$FILE" -C "$RUNNER_TEMP/gitleaks"
          test -x "$RUNNER_TEMP/gitleaks/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: 扫描当前工作区文件
        run: "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --exit-code=2 .
      - name: 扫描全部可达分支与标签的 Git 历史
        run: "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --exit-code=2 --log-opts="--all" .
