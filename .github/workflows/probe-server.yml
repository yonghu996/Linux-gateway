name: Probe Server Go CI

on:
  push:
    paths:
      - 'probe-server/**'
      - '.github/workflows/probe-server.yml'
  pull_request:
    paths:
      - 'probe-server/**'
      - '.github/workflows/probe-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Go 1.27.4 测试、安全检查与 Linux AMD64 构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
      - name: 安装 Go 1.27.4
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: probe-server/go.mod
      - name: 运行完整测试
        working-directory: probe-server
        run: bash ci/validate.sh
      - name: govulncheck
        working-directory: probe-server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: gosec
        working-directory: probe-server
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find probe-server -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do shellcheck "$f"; done
      - name: 验证 systemd 单元
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd
          sed 's#ExecStart=/usr/local/bin/probe-server#ExecStart=/usr/bin/true#' probe-server/systemd/probe-server.service > /tmp/probe-server.service
          systemd-analyze verify /tmp/probe-server.service
          systemd-analyze security --offline=yes /tmp/probe-server.service
      - name: 构建 Linux AMD64
        working-directory: probe-server
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/probe-server-linux-amd64 ./cmd/probe-server
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o dist/probe-keygen-linux-amd64 ./cmd/probe-keygen
          file dist/*
          sha256sum dist/*
